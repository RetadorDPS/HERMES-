name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  calidad:
    name: Tipos, Prisma y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autods
          POSTGRES_PASSWORD: autods
          POSTGRES_DB: autods
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U autods" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://autods:autods@localhost:5432/autods?schema=public
      REDIS_URL: redis://localhost:6379
      ENCRYPTION_KEY: ci-encryption-key-not-secret
      NEXTAUTH_SECRET: ci-nextauth-secret-not-secret
      NEXTAUTH_URL: http://localhost:3000
      AUTH_ENABLED: 'false'
      SCRAPER_MODE: demo

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar el esquema Prisma
        run: npx prisma validate

      - name: Generar el cliente Prisma
        run: npx prisma generate

      - name: Comprobar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Aplicar el esquema y sembrar datos
        run: |
          npx prisma db push
          npm run prisma:seed

      - name: Build de producción
        run: npm run build

      - name: Verificación end-to-end
        run: |
          npm run worker:sync & sleep 8
          npm run verify:e2e
